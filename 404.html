
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071321">

  <title>Liberty Motors USA</title>

  <script>
    (function () {
      var base = "/LIBERTYMOTORSUSA/";
      var path = window.location.pathname;

      if (path.startsWith(base) && path !== base) {
        var route = path.slice(base.length);
        var query = window.location.search;
        var hash = window.location.hash;

        sessionStorage.setItem(
          "liberty_redirect",
          route + query + hash
        );

        window.location.replace(base);
      }
    })();
  </script>

  <meta http-equiv="refresh" content="0;url=/LIBERTYMOTORSUSA/">
</head>

<body>
  <p>Redirecting to Liberty Motors USA...</p>
  <a href="/LIBERTYMOTORSUSA/">Return to homepage</a>
</body>
</html>
